<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remarkable Paper Pro Move Daily Calendar Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Daily Calendar Generator for Remarkable Paper Pro Move</h1>

        <form id="calendar-form">
            <div class="form-group">
                <label>Your iCal Calendars (URLs):</label>
                <div id="calendar-list">
                    <div class="calendar-entry">
                        <input type="text" name="ical_url_0" class="ical-url" placeholder="https://calendar.google.com/calendar/ical/...">
                        <input type="color" name="color_0" class="calendar-color" value="#4A4A4A" title="Event color">
                        <button type="button" class="remove-calendar" title="Remove">&times;</button>
                    </div>
                </div>
                <button type="button" id="add-calendar" class="add-btn">+ Add Calendar URL</button>
            </div>

            <div class="form-group google-section">
                <label>Google Calendar:</label>
                <div id="google-status">
                    <button type="button" id="google-connect" class="google-btn">Connect Google Calendar</button>
                </div>
                <div id="google-auth-code" class="hidden">
                    <p>Paste the authorization code from Google:</p>
                    <input type="text" id="auth-code-input" placeholder="Paste code here...">
                    <button type="button" id="submit-auth-code" class="add-btn">Submit</button>
                </div>
                <div id="google-calendars" class="hidden">
                    <p class="connected-status">Connected <button type="button" id="google-disconnect" class="disconnect-btn">Disconnect</button></p>
                    <div id="google-calendar-list"></div>
                </div>
            </div>

            <div class="form-group">
                <label>Or upload ICS files:</label>
                <div id="file-list">
                    <div class="file-entry">
                        <input type="file" name="ics_file_0" class="ics-file" accept=".ics">
                        <input type="color" name="file_color_0" class="calendar-color" value="#2E86AB" title="Event color">
                        <button type="button" class="remove-file" title="Remove">&times;</button>
                    </div>
                </div>
                <button type="button" id="add-file" class="add-btn">+ Add ICS File</button>
            </div>

            <div class="form-group">
                <label for="start_date">Start Date (leave blank for next Monday):</label>
                <input type="date" id="start_date" name="start_date">
            </div>

            <div class="form-group">
                <label for="end_date">End Date (leave blank for 7 days from start):</label>
                <input type="date" id="end_date" name="end_date">
            </div>


            <div class="form-group time-range-group">
                <div class="time-input">
                    <label for="start_hour">Start Hour:</label>
                    <select id="start_hour" name="start_hour">
                        <option value="5">5 AM</option>
                        <option value="6" selected>6 AM</option>
                        <option value="7">7 AM</option>
                        <option value="8">8 AM</option>
                        <option value="9">9 AM</option>
                        <option value="10">10 AM</option>
                    </select>
                </div>
                <div class="time-input">
                    <label for="end_hour">End Hour:</label>
                    <select id="end_hour" name="end_hour">
                        <option value="14">2 PM</option>
                        <option value="15">3 PM</option>
                        <option value="16">4 PM</option>
                        <option value="17" selected>5 PM</option>
                        <option value="18">6 PM</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="generate-btn">Generate PDF</button>
        </form>

        <div id="status" class="status hidden"></div>
    </div>

    <script>
        // Calendar management
        let calendarCount = 1;
        const defaultColors = ['#4A4A4A', '#2E86AB', '#A23B72', '#F18F01', '#C73E1D', '#3B1F2B'];

        document.getElementById('add-calendar').addEventListener('click', function() {
            const calendarList = document.getElementById('calendar-list');
            const newEntry = document.createElement('div');
            newEntry.className = 'calendar-entry';
            const colorIndex = calendarCount % defaultColors.length;
            newEntry.innerHTML = `
                <input type="text" name="ical_url_${calendarCount}" class="ical-url" placeholder="https://calendar.google.com/calendar/ical/...">
                <input type="color" name="color_${calendarCount}" class="calendar-color" value="${defaultColors[colorIndex]}" title="Event color">
                <button type="button" class="remove-calendar" title="Remove">&times;</button>
            `;
            calendarList.appendChild(newEntry);
            calendarCount++;
        });

        document.getElementById('calendar-list').addEventListener('click', function(e) {
            if (e.target.classList.contains('remove-calendar')) {
                const entries = document.querySelectorAll('.calendar-entry');
                if (entries.length > 1) {
                    e.target.parentElement.remove();
                }
            }
        });

        // File upload management
        let fileCount = 1;
        const fileColors = ['#2E86AB', '#A23B72', '#F18F01', '#C73E1D', '#3B1F2B', '#4A4A4A'];

        document.getElementById('add-file').addEventListener('click', function() {
            const fileList = document.getElementById('file-list');
            const newEntry = document.createElement('div');
            newEntry.className = 'file-entry';
            const colorIndex = fileCount % fileColors.length;
            newEntry.innerHTML = `
                <input type="file" name="ics_file_${fileCount}" class="ics-file" accept=".ics">
                <input type="color" name="file_color_${fileCount}" class="calendar-color" value="${fileColors[colorIndex]}" title="Event color">
                <button type="button" class="remove-file" title="Remove">&times;</button>
            `;
            fileList.appendChild(newEntry);
            fileCount++;
        });

        document.getElementById('file-list').addEventListener('click', function(e) {
            if (e.target.classList.contains('remove-file')) {
                const entries = document.querySelectorAll('.file-entry');
                if (entries.length > 1) {
                    e.target.parentElement.remove();
                }
            }
        });

        // Google Calendar management
        let googleCalendarCount = 0;

        async function checkGoogleStatus() {
            try {
                const response = await fetch('/google/status');
                const data = await response.json();
                if (data.authenticated) {
                    document.getElementById('google-status').classList.add('hidden');
                    document.getElementById('google-auth-code').classList.add('hidden');
                    document.getElementById('google-calendars').classList.remove('hidden');
                    loadGoogleCalendars();
                }
            } catch (error) {
                console.error('Error checking Google status:', error);
            }
        }

        async function loadGoogleCalendars() {
            try {
                const response = await fetch('/google/calendars');
                const data = await response.json();
                const listDiv = document.getElementById('google-calendar-list');
                listDiv.innerHTML = '';
                googleCalendarCount = 0;

                data.calendars.forEach((cal, index) => {
                    const entry = document.createElement('div');
                    entry.className = 'google-calendar-entry';
                    entry.innerHTML = `
                        <input type="checkbox" name="google_cal_${index}" value="${cal.id}" id="gcal_${index}" checked>
                        <label for="gcal_${index}">${cal.summary}${cal.primary ? ' (Primary)' : ''}</label>
                        <input type="color" name="google_color_${index}" class="calendar-color" value="${cal.backgroundColor}" title="Event color">
                    `;
                    listDiv.appendChild(entry);
                    googleCalendarCount++;
                });
            } catch (error) {
                console.error('Error loading calendars:', error);
            }
        }

        document.getElementById('google-connect').addEventListener('click', async function() {
            try {
                const response = await fetch('/google/auth');
                const data = await response.json();
                window.open(data.auth_url, '_blank');
                document.getElementById('google-status').classList.add('hidden');
                document.getElementById('google-auth-code').classList.remove('hidden');
            } catch (error) {
                console.error('Error starting Google auth:', error);
            }
        });

        document.getElementById('submit-auth-code').addEventListener('click', async function() {
            const code = document.getElementById('auth-code-input').value.trim();
            if (!code) return;

            try {
                const response = await fetch('/google/callback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('google-auth-code').classList.add('hidden');
                    document.getElementById('google-calendars').classList.remove('hidden');
                    loadGoogleCalendars();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                console.error('Error submitting auth code:', error);
            }
        });

        document.getElementById('google-disconnect').addEventListener('click', async function() {
            try {
                await fetch('/google/disconnect', { method: 'POST' });
                document.getElementById('google-calendars').classList.add('hidden');
                document.getElementById('google-calendar-list').innerHTML = '';
                document.getElementById('google-status').classList.remove('hidden');
            } catch (error) {
                console.error('Error disconnecting:', error);
            }
        });

        // Check Google status on page load
        checkGoogleStatus();

        // Update end hour options based on start hour selection
        function updateEndHourOptions() {
            const startHour = parseInt(document.getElementById('start_hour').value);
            const endHourSelect = document.getElementById('end_hour');
            const currentEndHour = parseInt(endHourSelect.value);

            // Clear existing options
            endHourSelect.innerHTML = '';

            // Generate options for 8-12 hours duration
            const minEndHour = startHour + 8;  // Minimum 8 hours
            const maxEndHour = Math.min(startHour + 16, 23);  // Maximum 16 hours or 11 PM

            let selectedValue = null;
            for (let hour = minEndHour; hour <= maxEndHour; hour++) {
                const option = document.createElement('option');
                option.value = hour;

                if (hour === 12) {
                    option.textContent = '12 PM';
                } else if (hour > 12) {
                    option.textContent = (hour - 12) + ' PM';
                } else {
                    option.textContent = hour + ' AM';
                }

                // Try to maintain the current selection if valid
                if (hour === currentEndHour && hour >= minEndHour && hour <= maxEndHour) {
                    option.selected = true;
                    selectedValue = hour;
                } else if (!selectedValue && hour === Math.min(22, maxEndHour)) {
                    // Default to 10 PM or max available
                    option.selected = true;
                    selectedValue = hour;
                }

                endHourSelect.appendChild(option);
            }
        }

        // Update end hour options when start hour changes
        document.getElementById('start_hour').addEventListener('change', updateEndHourOptions);

        // Initialize on page load
        updateEndHourOptions();

        document.getElementById('calendar-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(e.target);

            // Add browser timezone to the form data
            const browserTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            formData.append('timezone', browserTimezone);

            // Collect selected Google calendars with sequential indices
            const googleEntries = document.querySelectorAll('.google-calendar-entry');
            let googleIndex = 0;
            googleEntries.forEach((entry) => {
                const checkbox = entry.querySelector('input[type="checkbox"]');
                const colorInput = entry.querySelector('input[type="color"]');
                if (checkbox && checkbox.checked) {
                    formData.append(`google_cal_${googleIndex}`, checkbox.value);
                    formData.append(`google_color_${googleIndex}`, colorInput.value);
                    googleIndex++;
                }
            });

            const statusDiv = document.getElementById('status');
            const generateBtn = document.getElementById('generate-btn');

            // Show loading state
            generateBtn.disabled = true;
            generateBtn.textContent = 'Generating...';
            statusDiv.className = 'status';
            statusDiv.textContent = 'Fetching calendar data and generating PDF...';

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    // If successful, download the PDF directly
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    // Extract filename from Content-Disposition header or use dates from form
                    const contentDisposition = response.headers.get('Content-Disposition');
                    let filename = 'calendar.pdf';
                    if (contentDisposition) {
                        const filenameMatch = contentDisposition.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/);
                        if (filenameMatch && filenameMatch[1]) {
                            filename = filenameMatch[1].replace(/['"]/g, '');
                        }
                    } else {
                        // Fallback: generate filename from form data
                        const startDate = new Date(formData.get('start_date'));
                        const endDate = new Date(formData.get('end_date'));
                        if (startDate.toDateString() === endDate.toDateString()) {
                            filename = `${startDate.getMonth() + 1}-${startDate.getDate()}.pdf`;
                        } else {
                            filename = `${startDate.getMonth() + 1}-${startDate.getDate()}-to-${endDate.getMonth() + 1}-${endDate.getDate()}.pdf`;
                        }
                    }
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);

                    statusDiv.className = 'status success';
                    statusDiv.textContent = 'PDF generated and downloaded successfully!';
                } else {
                    // Handle error response
                    const result = await response.json();
                    statusDiv.className = 'status error';
                    statusDiv.textContent = 'Error: ' + result.error;
                }
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Error: ' + error.message;
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = 'Generate PDF';
            }
        });
    </script>
</body>
</html>
